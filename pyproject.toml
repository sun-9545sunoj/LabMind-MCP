[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labmind-mcp"
version = "0.1.0"
description = "MCP server for laboratory diagnostics, anomaly detection, and clinical risk prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "LabMind Team" },
]
keywords = ["mcp", "clinical", "diagnostics", "machine-learning", "laboratory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # server.py supports both the 1.x (FastMCP) and 2.x (MCPServer) APIs
    "mcp>=1.2.0,<3",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "shap>=0.43.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
labmind-mcp = "labmind.server:main"

[tool.hatch.build.targets.wheel]
packages = ["labmind"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
